[package]
name = "simple-rpa-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "winbase", "winnt", "processthreadsapi",
    "libloaderapi", "errhandlingapi", "objbase", "combaseapi",
    "shobjidl_core", "shellapi", "wincon", "fileapi",
    "memoryapi", "handleapi",
] }
